<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="apple-mobile-web-app-title" content="Vesselbound">
  <meta name="theme-color" content="#1F1F20">
  <title>Vesselbound</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1F1F20; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: #1F1F20; display: block; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #ddd; font: 18px system-ui, sans-serif; gap: 14px; }
    #bar { width: 60vw; max-width: 320px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #c9a24a; }
    #err { color: #f88; max-width: 80vw; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>Vesselbound</div><div id="bar"><div id="fill"></div></div><div id="err"></div></div>
  <script src="b20261119164335/WebGL.loader.js"></script>
  <script>
    // server.json (kept current by tools/start-web-play.ps1) holds the live tunnel address, so one bookmark always works.
    // The game reads it from the page address as ?server=...
    async function start() {
    try {
      var r = await fetch("server.json?" + Date.now(), { cache: "no-store" });
      if (r.ok) {
        var j = await r.json();
        if (j && j.url) { var u = new URL(location.href); u.searchParams.set("server", j.url); history.replaceState(null, "", u); }
      }
    } catch (e) { /* no server.json: offline play still works */ }
    createUnityInstance(document.querySelector("#unity-canvas"), {
      arguments: [],
      dataUrl: "b20261119164335/WebGL.data.unityweb",
      frameworkUrl: "b20261119164335/WebGL.framework.js.unityweb",
      codeUrl: "b20261119164335/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Vesselbound Dev",
      productName: "Vesselbound",
      productVersion: "0.1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    }, function (p) { document.getElementById("fill").style.width = (p * 100) + "%"; })
    .then(function () { document.getElementById("loading").style.display = "none"; })
    .catch(function (m) { document.getElementById("err").textContent = String(m); });
    }
    start();
  </script>
</body>
</html>
